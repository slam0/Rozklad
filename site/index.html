/* ---------- języki: polski, angielski, rosyjski ---------- */
var I={

 err_data:'Ошибка в данных: {0}',err_list:'Не удалось загрузить список остановок (код {0}). Проверьте подключение к интернету.',

};
var LANG='pl',SAY=null;
function t(k,a){var s=(I[LANG]&&I[LANG][k])||I.pl[k]||k,i;
  if(a)for(i=0;i<a.length;i++)s=s.split('{'+i+'}').join(a[i]);
  return s}
function detectLang(){
  var m=/[?&]lang=(pl|en|ru)/.exec(location.search),s,n;
  if(m)return m[1];
  try{s=localStorage.getItem('rzlang');if(s&&I[s])return s}catch(e){}
  n=String(navigator.language||navigator.userLanguage||'pl').toLowerCase().slice(0,2);
  return n==='ru'?'ru':(n==='pl'?'pl':'en')}
function ageText(){
  var today=new Date(),ymd=''+today.getFullYear()+p2(today.getMonth()+1)+p2(today.getDate()),s;
  if(!IDX){$('age').textContent='';return}
  s=t('age_gen',[IDX.gen])+(IDX.end?t('age_end',[dmy(IDX.end)]):'')+'.';
  if(IDX.end&&IDX.end<ymd)s+=' '+t('age_exp');
  $('age').textContent=s}
function setLang(l){
  var els=document.querySelectorAll('[data-t]'),i,h='',L=['pl','en','ru'];
  LANG=l;
  for(i=0;i<els.length;i++)els[i].textContent=t(els[i].getAttribute('data-t'));
  $('q').placeholder=t('ph_q');
  document.title=t('title');
  document.documentElement.lang=l;
  for(i=0;i<L.length;i++)h+='<a data-l="'+L[i]+'"'+(L[i]===l?' class="on"':'')+'>'+L[i].toUpperCase()+'</a>';
  $('langs').innerHTML=h;
  if(SAY)say(SAY[0],SAY[1],SAY[2]);
  ageText();
  if(IDX)render()}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
var MAP={};(function(){var g={a:'ąáàâäãåā',c:'ćč',d:'ď',e:'éèêëęě',i:'íìîï',l:'ł',n:'ńňñ',o:'óòôöõő',r:'ř',s:'śš',t:'ť',u:'úùûüůű',y:'ý',z:'źžż'},k,i;
  for(k in g)for(i=0;i<g[k].length;i++)MAP[g[k].charAt(i)]=k})();
function nz(s){var o='',i,c;s=String(s).toLowerCase();
  for(i=0;i<s.length;i++){c=s.charAt(i);o+=MAP[c]||c}
  return o}
function say(k,a,bad){var m=$('msg');SAY=[k,a,bad];m.textContent=t(k,a);m.className=bad?'bad':''}
function p2(n){return n<10?'0'+n:''+n}
function dmy(s){return s&&s.length===8?s.slice(6,8)+'.'+s.slice(4,6)+'.'+s.slice(0,4):''}

/* ---------- pobieranie ---------- */
function get(url,ok,fail,prog){
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status===200)ok(x.responseText);else fail(x.status)};
  if(prog)x.onprogress=function(e){prog(e.loaded)};
  x.send(null);
  return x}
function getAll(urls,cb,prog){
  var out=[],i=0,active=0,done=0,err=null,fin=false;
  function pump(){
    while(!err&&active<5&&i<urls.length){(function(n){
      active++;
      get(urls[n],function(t){out[n]=t;active--;done++;prog(done,urls.length);pump()},
        function(s){if(!err)err=[urls[n],s];active--;pump()})
    })(i++)}
    if(active===0&&!fin&&(err||done===urls.length)){fin=true;cb(err,out)}}
  pump()}

/* ---------- zapamiętywanie wyboru w tej przeglądarce ---------- */
function gid(g){return g[0]+'|'+g[5].map(function(p){return p[1]}).join(',')}
function save(){try{
  var o={};KINDS.forEach(function(K){o[K.k]=chosen[K.k].map(gid)});
  localStorage.setItem('rzsel',JSON.stringify(o))}catch(e){}}
function restore(){try{
  var o=JSON.parse(localStorage.getItem('rzsel')||'null'),by={};
  if(!o)return;
  G.forEach(function(g){by[gid(g)]=g});
  KINDS.forEach(function(K){chosen[K.k]=(o[K.k]||[]).map(function(id){return by[id]}).filter(function(g){return g&&(g[2]&K.bit)}).slice(0,MAX)})}catch(e){}}

/* ---------- wczytanie listy przystanków ---------- */
function load(){
  $('wiz').hidden=true;$('again').hidden=true;say('loading');
  get('index.json?t='+(+new Date()),function(t){
    try{
      IDX=JSON.parse(t);G=IDX.g;
      restore();
      say('loaded',[G.length]);
      ageText();
      $('wiz').hidden=false;render();
    }catch(e){say('err_data',[e.message],true);$('again').hidden=false}
  },function(s){
    say('err_list',[s],true);$('again').hidden=false
  },function(n){say('loading_kb',[Math.round(n/1024)])})}
$('retry').onclick=load;

/* ---------- kroki ---------- */
function info(g,bit){
  var ps=g[5].filter(function(p){return p[2]&bit});
  return esc(g[0])+' <small>'+t('poles',[ps.length,esc(ps.map(function(p){return p[1]}).join(', '))])+'</small>'+(g[3]?' <a href="https://www.openstreetmap.org/?mlat='+g[3]+'&amp;mlon='+g[4]+'&amp;zoom=17" target="_blank">'+t('map')+'</a>':'')}
function total(){return KINDS.reduce(function(n,K){return n+chosen[K.k].length},0)}
function plan(){
  var m={},order=[];
  KINDS.forEach(function(K){chosen[K.k].forEach(function(g){g[5].forEach(function(p){
    if(!(p[2]&K.bit))return;
    if(m[p[0]]===undefined){m[p[0]]=0;order.push(p[0])}
    m[p[0]]|=K.bit})})});
  return order.map(function(n){return [n,m[n]]})}
function link(){
  var pl=plan();
  return 'rozklad://import?u='+encodeURIComponent(BASE)+'&v='+IDX.v+'&p='+pl.map(function(x){return x[0]+'.'+x[1]}).join(',')}
function render(){
  var K=KINDS[step],list=chosen[K.k],tot,pl;
  $('steps').innerHTML=KINDS.map(function(X,n){
    return '<div class="st'+(n===step?' on':'')+'" data-s="'+n+'"><i style="background:'+X.col+'">'+(n+1)+'</i>'+t('k_'+X.k)+'<small>'+chosen[X.k].length+' '+t('sel_short')+'</small></div>'}).join('');
  $('ph').textContent=t('step',[step+1,t('k_'+K.k)]);
  $('pd').textContent=t('pd',[t('d_'+K.k),MAX]);
  $('sel').innerHTML=list.map(function(g,n){return '<li><button data-r="'+n+'">×</button> '+info(g,K.bit)+'</li>'}).join('');
  $('cnt').textContent=list.length;
  $('q').disabled=list.length>=MAX;$('q').value='';$('res').innerHTML='';
  $('back').disabled=step===0;
  $('next').style.display=step===3?'none':'';
  $('back').style.width=step===3?'100%':'';
  $('fin').hidden=step!==3;
  if(step===3){
    tot=total();pl=plan();
    $('sum').textContent=tot?t('sum',[tot,KINDS.map(function(X){return t('k_'+X.k).toLowerCase()+' '+chosen[X.k].length}).join(', '),pl.length]):t('sum0');
    $('open').style.display=tot?'':'none';
    if(tot)$('open').href=link();
    $('dl').hidden=!(tot&&canDownload());
    $('warn').textContent='';
  }
  save()}
$('steps').onclick=function(e){var n=(e||window.event).target;
  while(n&&n!==this&&(!n.getAttribute||n.getAttribute('data-s')===null))n=n.parentNode;
  if(n&&n!==this){step=+n.getAttribute('data-s');render()}};
$('back').onclick=function(){if(step>0){step--;render()}};
$('next').onclick=function(){if(step<3){step++;render()}};
$('q').oninput=function(){
  try{
    var K=KINDS[step],qs=nz(this.value).replace(/^\s+|\s+$/g,''),h='',n=0,i,g,k,pass,hit;
    if(qs.length>1&&chosen[K.k].length<MAX){
      for(pass=0;pass<2&&n<30;pass++){
        for(i=0;i<G.length&&n<30;i++){g=G[i];
          if(!(g[2]&K.bit)||chosen[K.k].indexOf(g)>=0)continue;
          k=g[1]||g[0].toLowerCase();
          hit=pass===0?(k.indexOf(qs)===0||k.indexOf(' '+qs)>=0):(k.indexOf(qs)>=0&&!(k.indexOf(qs)===0||k.indexOf(' '+qs)>=0));
          if(hit){n++;h+='<li><button data-i="'+i+'">+</button> '+info(g,K.bit)+'</li>'}}}
      if(!n)h='<li>'+t('nores',[esc(this.value)])+'</li>'}
    $('res').innerHTML=h;
  }catch(e){say('err_search',[e.message],true)}};
$('res').onclick=function(e){var i=(e||window.event).target.getAttribute('data-i'),K=KINDS[step];
  if(i!==null&&chosen[K.k].length<MAX){chosen[K.k].push(G[i]);render();if(chosen[K.k].length<MAX)$('q').focus()}};
$('sel').onclick=function(e){var i=(e||window.event).target.getAttribute('data-r');if(i!==null){chosen[KINDS[step].k].splice(i,1);render()}};

/* ---------- plik rozklad.json do pobrania (na komputerze) ---------- */
function canDownload(){
  try{return !!(window.Blob&&window.URL&&window.URL.createObjectURL&&('download' in document.createElement('a')))}catch(e){return false}}
function assemble(texts,pl){
  var svc=JSON.parse(texts[0]),remap={},S=[],stops=[],i,j,p,d,gr,k,mins;
  for(i=0;i<pl.length;i++){
    p=JSON.parse(texts[i+1]);d=[];
    for(j=0;j<p.g.length;j++){gr=p.g[j];
      if(!(pl[i][1]&KB[gr[3]]))continue;
      if(remap[gr[2]]===undefined){remap[gr[2]]=S.length;S.push(svc.svc[gr[2]])}
      for(k=0;k<gr[4].length;k++)d.push([gr[0],gr[1],remap[gr[2]],gr[4][k],gr[3]])}
    d.sort(function(a,b){return a[3]-b[3]});
    if(d.length)stops.push({n:p.n,c:p.c,d:d})}
  return {gen:svc.gen,end:svc.end,stops:stops,svc:S}}
$('get').onclick=function(){
  var pl=plan(),root=BASE+'d/'+IDX.v+'/',urls=[root+'svc.json'],i,btn=this;
  for(i=0;i<pl.length;i++)urls.push(root+'s/'+pl[i][0]+'.json');
  btn.disabled=true;$('warn').textContent=t('dl_progress',[0,urls.length]);
  getAll(urls,function(err,texts){
    btn.disabled=false;
    if(err){$('warn').textContent=t('err_file',err);return}
    try{
      var o=assemble(texts,pl),json=JSON.stringify(o).replace(/</g,'\\u003c'),b=new Blob([json],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download='rozklad.json';document.body.appendChild(a);a.click();document.body.removeChild(a);
      $('warn').textContent=t('dl_done',[Math.round(json.length/1024)]);
      window.__rz=o;
    }catch(e){$('warn').textContent=t('dl_err',[e.message])}
  },function(n,m){$('warn').textContent=t('dl_progress',[n,m])})};

$('langs').onclick=function(e){var n=(e||window.event).target;
  var l=n&&n.getAttribute?n.getAttribute('data-l'):null;
  if(l){try{localStorage.setItem('rzlang',l)}catch(x){}setLang(l)}};
setLang(detectLang());
load();
})();
</script>
