name: Strona z rozkładem

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/strona.yml'
  schedule:
    - cron: '23 3 * * 1'     # co poniedziałek rano pobiera świeże dane
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz warsaw.zip
        run: |
          mkdir -p work
          if curl -fL --retry 4 --retry-delay 10 -A "Rozklad-iOS6 (GitHub Actions)" -o work/warsaw.zip https://mkuran.pl/gtfs/warsaw.zip; then
            echo "Pobrano warsaw.zip z mkuran.pl"
          elif [ -f dane/warsaw.zip ]; then
            echo "Nie udało się pobrać, używam pliku dane/warsaw.zip z repozytorium"
            cp dane/warsaw.zip work/warsaw.zip
          else
            echo "Nie udało się pobrać warsaw.zip, a w repozytorium nie ma pliku dane/warsaw.zip"
            exit 1
          fi
          ls -l work/warsaw.zip

      - name: Testy skryptu
        run: python3 -m unittest discover -s tools/tests -p 'test_build_data.py'

      - name: Podziel dane na małe pliki
        run: python3 tools/build_data.py work/warsaw.zip _site

      - name: Dodaj stronę
        run: cp -r site/. _site/

      - name: Pobierz ostatnią zbudowaną aplikację (jeśli już jest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/release
          gh release download najnowsza -R "$GITHUB_REPOSITORY" -D work/release -p '*.deb' -p '*.ipa' \
            || echo "Nie ma jeszcze opublikowanej wersji aplikacji - strona będzie bez pobierania."
          ls -l work/release || true

      - name: Testy repozytorium Cydii
        run: python3 -m unittest discover -s tools/tests -p 'test_build_repo.py'

      - name: Złóż repozytorium Cydii i pliki do pobrania
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')"
          python3 tools/build_repo.py work/release _site "https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Rozmiar strony
        run: |
          du -sh _site
          find _site -type f | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
