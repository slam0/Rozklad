name: Strona z rozkładem

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/strona.yml'
  schedule:
    - cron: '23 3 * * 1'     # co poniedziałek rano pobiera świeże dane
  workflow_dispatch:
  workflow_run:            # po zbudowaniu aplikacji sama odświeża stronę
    workflows: ["Zbuduj aplikację"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Testy skryptów danych
        run: python3 -m unittest discover -s tools/tests -p 'test_build_data.py' && python3 -m unittest discover -s tools/tests -p 'test_generic.py' && python3 -m unittest discover -s tools/tests -p 'test_build_all.py'

      - name: Pobierz dane miast i podziel na małe pliki
        run: python3 tools/build_all.py tools/miasta.json _site work

      - name: Dodaj stronę
        run: cp -r site/. _site/

      - name: Pobierz ostatnią zbudowaną aplikację (jeśli już jest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/release
          gh release download najnowsza -R "$GITHUB_REPOSITORY" -D work/release -p '*.deb' -p '*.ipa' \
            || echo "Nie ma jeszcze opublikowanej wersji aplikacji - strona będzie bez pobierania."
          ls -l work/release || true

      - name: Testy skryptu pobierania
        run: python3 -m unittest discover -s tools/tests -p 'test_build_pobierz.py'

      - name: Złóż pliki do pobrania
        env:
          # Repozytorium Cydii jest osobnym repozytorium na GitHubie (zob. README). Zmień nazwę, jeśli nazwiesz je inaczej.
          CYDIA_REPO_URL: https://slam0.github.io/cydia/
        run: python3 tools/build_pobierz.py work/release _site "$CYDIA_REPO_URL"

      - name: Rozmiar strony
        run: |
          du -sh _site
          find _site -type f | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
